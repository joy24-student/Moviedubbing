name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src tests
      - name: Test
        run: python -m pytest --cov=aidub --cov-report=xml --cov-report=term-missing
      - name: CLI smoke
        run: python -m aidub doctor --json

  package:
    name: Build and inspect distributions
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          Push-Location $env:RUNNER_TEMP
          try {
            aidub doctor --json
            aidub --help
            $project = Join-Path $env:RUNNER_TEMP ("wheel-smoke-" + [guid]::NewGuid().ToString("N"))
            aidub project create $project --name "Wheel Smoke" --source-language en-US `
              --operator ci --rights-basis "Authorized CI fixture" `
              --localizations bn-BD hi-IN --json
            aidub project validate ($project + ".aidub") --json
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  desktop-smoke:
    name: Native Windows desktop smoke
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop lane
        run: python -m pip install --disable-pip-version-check -e ".[desktop,dev]"
      - name: Exercise native shell and localization
        run: python -m pytest tests/unit/ui tests/unit/i18n tests/integration/ui
