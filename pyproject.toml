[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aidub-studio"
version = "0.1.0.dev0"
description = "Local-first, production-oriented AI movie dubbing workstation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "AI Dubbing Studio Engineering" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.9,<7",
  "qasync>=0.28,<1",
]
persistence = [
  "alembic>=1.16,<2",
  "platformdirs>=4.3,<5",
  "sqlalchemy>=2.0.41,<3",
]
dev = [
  "hypothesis>=6.136,<7",
  "mypy>=1.17,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
aidub = "aidub.cli:main"
aidub-studio = "aidub.ui.application:run_desktop"

[tool.hatch.build.targets.wheel]
packages = ["src/aidub"]
artifacts = [
  "src/aidub/infrastructure/persistence/migrations_sql/*.sql",
]

[tool.hatch.build.targets.wheel.force-include]
"resources/i18n" = "aidub/i18n/catalogs"

[tool.hatch.build.targets.sdist]
include = [
  "src/aidub",
  "resources/i18n",
  "migrations",
  "tests",
  "docs",
  "benchmarks",
  "README.md",
  "ENTERPRISE_IMPLEMENTATION_PLAN.md",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
unit = "pytest {args:tests/unit}"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"
check = ["format-check", "lint", "typecheck", "test"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "--showlocals",
  "-ra",
]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["aidub"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Headless foundation gate. Ratchet toward 85 as native Qt/media lanes land.
fail_under = 60
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".wheel-smoke", ".wheel-install-smoke"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FA",
  "FBT",
  "FURB",
  "I",
  "ICN",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "ANN401",
  # Pydantic resolves these annotations at runtime when generating validation/JSON schemas.
  "TC001",
  "TC002",
  "TC003",
  # Named aliases retain clearer generated Pydantic schema definitions than anonymous PEP 695 aliases.
  "UP040",
  "UP047",
  # Domain operation exceptions intentionally use concise public API names.
  "N818",
  # Aggregate invariant validators are kept together so no construction path skips a rule.
  "PLR0912",
  "PLR0913",
  "PLR2004",
  "S101",
  # Same-module value objects share a private rate guard; it is not an external API access.
  "SLF001",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "PLR2004", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["aidub"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true
